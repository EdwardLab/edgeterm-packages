[package]
name = "xdelta3"
version = "3.1.0"
revision = "1edgeterm2"
license = "GPL-2.0-or-later"
homepage = "https://github.com/jmacd/xdelta"
description = "Binary delta encoder and decoder"
depends = []

[source]
url = "https://github.com/jmacd/xdelta/archive/refs/tags/v3.1.0.tar.gz"
sha256 = "7515cf5378fca287a57f4e2fee1094aabc79569cfe60d91e06021a8fd7bae29d"

[build]
system = "autotools"
pristine_source = true
source_subdirectory = "xdelta3"
threads = true
configure_args = ["--disable-shared"]
make_args = []
install_args = []
build_commands = ['make -j"${BUILD_JOBS:-4}" xdelta3 CFLAGS="$EDGETERM_COMPILE_CFLAGS"']
install_commands = ["install -d /build/stage/usr/local/bin", "install -m 755 /build/work/xdelta3 /build/stage/usr/local/bin/xdelta3"]
dependencies = []
pre = []
post = []

[runtime]
commands = ["xdelta3"]
mode = "streaming"
capability = "full"

[tests]
smoke = ["xdelta3 -V"]
