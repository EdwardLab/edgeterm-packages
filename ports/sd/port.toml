[package]
name = "sd"
version = "1.1.0"
revision = "1edgeterm1"
license = "MIT"
homepage = "https://github.com/chmln/sd"
description = "Find and replace utility"
depends = []

[source]
url = "https://github.com/chmln/sd/archive/refs/tags/v1.1.0.tar.gz"
sha256 = "defdce484f8c92f265e1282490572575028967c2c55d356111d1e49a3ea9a88e"

[build]
system = "cargo"
pristine_source = true
locked = false
install_args = ["install -m 755 target/wasm32-wasip1/release/sd.wasm /build/stage/usr/local/bin/sd"]
dependencies = []
pre = []
post = []

[runtime]
commands = ["sd"]
mode = "streaming"
capability = "full"

[tests]
smoke = ["sd --version"]
