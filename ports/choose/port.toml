[package]
name = "choose"
version = "1.3.7"
revision = "1edgeterm1"
license = "GPL-3.0-or-later"
homepage = "https://github.com/theryangeary/choose"
description = "Field and range selector"
depends = []

[source]
url = "https://github.com/theryangeary/choose/archive/refs/tags/v1.3.7.tar.gz"
sha256 = "8f51a315fbbe0688c4a2078ba8bc8446d36943b6cce6ed9bbd6a11f33bd1a134"

[build]
system = "cargo"
pristine_source = true
locked = false
install_args = ["install -m 755 target/wasm32-wasip1/release/choose.wasm /build/stage/usr/local/bin/choose"]
dependencies = []
pre = []
post = []

[runtime]
commands = ["choose"]
mode = "streaming"
capability = "full"

[tests]
smoke = ["choose --version"]
