[package]
name = "zstd"
version = "1.5.7"
revision = "1edgeterm1"
license = "BSD-3-Clause"
homepage = "https://facebook.github.io/zstd/"
description = "Zstandard compression utility"
depends = []

[source]
url = "https://github.com/facebook/zstd/archive/refs/tags/v1.5.7.tar.gz"
sha256 = "37d7284556b20954e56e1ca85b80226768902e2edabd3b649e9e72c0c9012ee3"

[build]
system = "custom"
commands = ["make -C \"$SOURCE_DIR/programs\" -j\"${BUILD_JOBS:-4}\" CC=\"$CC\" AR=\"$AR\" RANLIB=\"$RANLIB\" STRIP=\"$STRIP\" CFLAGS=\"$CFLAGS\" LDFLAGS=\"$LDFLAGS\" zstd-nomt", "mkdir -p /build/stage/usr/local/bin", "ZSTD_BINARY=$(find \"$SOURCE_DIR/programs/obj\" -type f -name zstd -print -quit); test -n \"$ZSTD_BINARY\"; install -m 0755 \"$ZSTD_BINARY\" /build/stage/usr/local/bin/zstd", "cp /build/stage/usr/local/bin/zstd /build/stage/usr/local/bin/unzstd", "cp /build/stage/usr/local/bin/zstd /build/stage/usr/local/bin/zstdcat"]
make_args = []
install_args = []
dependencies = []
pre = []
post = []

[runtime]
commands = ["zstd","unzstd","zstdcat"]
mode = "streaming"
capability = "full"

[tests]
smoke = ["zstd --version","printf test | zstd | zstd -d"]
