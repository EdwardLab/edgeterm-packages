[package]
name = "make"
version = "4.4.1"
revision = "1edgeterm2"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/make/"
description = "GNU build automation utility"
depends = []

[source]
url = "https://ftp.gnu.org/gnu/make/make-4.4.1.tar.lz"
sha256 = "8814ba072182b605d156d7589c19a43b89fc58ea479b9355146160946f8cf6e9"

[build]
system = "autotools"
configure_args = ["--disable-nls"]
dependencies = []
pre = []
post = []
link_compat = true

[runtime]
commands = ["make"]
mode = "streaming"
capability = "full"

[tests]
smoke = ["make --version"]
