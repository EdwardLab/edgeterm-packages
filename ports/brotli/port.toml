[package]
name = "brotli"
version = "1.2.0"
revision = "1edgeterm1"
license = "MIT"
homepage = "https://github.com/google/brotli"
description = "Brotli compression utility"
depends = []

[source]
url = "https://github.com/google/brotli/archive/refs/tags/v1.2.0.tar.gz"
sha256 = "816c96e8e8f193b40151dad7e8ff37b1221d019dbcb9c35cd3fadbfe6477dfec"

[build]
system = "cmake"
configure_args = ["-DBROTLI_DISABLE_TESTS=ON"]
dependencies = []
pre = []
post = []

[runtime]
commands = ["brotli"]
mode = "streaming"
capability = "full"

[tests]
smoke = ["brotli --version"]

