[package]
name = "mawk"
version = "1.3.4-20250131"
revision = "1edgeterm1"
license = "GPL-2.0-only"
homepage = "https://invisible-island.net/mawk/"
description = "Fast pattern scanning and text processing language"
depends = []

[source]
url = "https://invisible-mirror.net/archives/mawk/mawk-1.3.4-20250131.tgz"
sha256 = "51bcb82d577b141d896d9d9c3077d7aaa209490132e9f2b9573ba8511b3835be"

[build]
system = "autotools"
pristine_source = true
configure_args = ["--disable-shared"]
make_args = []
install_args = []
build_commands = ['make -j"${BUILD_JOBS:-4}" CFLAGS="$EDGETERM_COMPILE_CFLAGS"']
install_commands = ["install -d /build/stage/usr/local/bin", "install -m 755 /build/work/mawk /build/stage/usr/local/bin/mawk"]
dependencies = []
pre = []
post = []

[runtime]
commands = ["mawk"]
mode = "streaming"
capability = "full"

[tests]
smoke = ["mawk -W version"]
