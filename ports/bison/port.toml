[package]
name = "bison"
version = "3.8.2"
revision = "1edgeterm7"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/bison/"
description = "Parser generator compatible with Yacc"
depends = ["m4"]

[source]
url = "https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz"
sha256 = "9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2"

[build]
system = "autotools"
configure_args = ["--disable-shared", "--disable-nls"]
make_args = []
install_args = []
dependencies = []
pre = ["export M4=/bin/m4"]
post = []
include_compat = true
link_compat = true
threads = true
asyncify = true
pristine_source = true

[runtime]
commands = ["bison", "yacc"]
mode = "streaming"
capability = "full"
exec_dependencies = ["m4"]

[runtime.command_aliases.yacc]
target = "bison"
args = ["-y"]

[tests]
smoke = ["bison --version"]
