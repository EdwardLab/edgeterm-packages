[package]
name = "mujs"
version = "1.3.7"
revision = "1edgeterm1"
license = "ISC"
homepage = "https://mujs.com/"
description = "Small embeddable JavaScript interpreter"
depends = []

[source]
url = "https://github.com/ccxvii/mujs/archive/refs/tags/1.3.7.tar.gz"
sha256 = "fa15735edc4b3d27675d954b5703e36a158f19cfa4f265aa5388cd33aede1c70"

[build]
system = "custom"
pristine_source = true
commands = [
  "install -d /build/stage/usr/local/bin",
  '$CC $CFLAGS "$SOURCE_DIR/one.c" "$SOURCE_DIR/main.c" -o /build/stage/usr/local/bin/mujs $LDFLAGS -lm',
]
dependencies = []
pre = []
post = []
asyncify = true

[runtime]
commands = ["mujs"]
mode = "interactive"
capability = "full"

[tests]
smoke = ["mujs /dev/null"]
