[package]
name = "hyperfine"
version = "1.20.0"
revision = "1edgeterm1"
license = "MIT"
homepage = "https://github.com/sharkdp/hyperfine"
description = "Command-line benchmarking tool"
depends = []

[source]
url = "https://github.com/sharkdp/hyperfine/archive/refs/tags/v1.20.0.tar.gz"
sha256 = "f90c3b096af568438be7da52336784635a962c9822f10f98e5ad11ae8c7f5c64"

[build]
system = "cargo"
target = "/toolchain/edgeterm-posix/config/threaded/wasm32-wasmer-wasi.json"
rust_unix = true
rust_libc_wasix = true
rust_rand_os_wasi = true
rust_wasix_toolchain = true
threads = true
install_args = ["install -m 755 target/wasm32-wasmer-wasi/release/hyperfine.wasm /build/stage/usr/local/bin/hyperfine"]
dependencies = []
pre = []
post = [
  "install -d /build/stage/usr/local/sbin",
  "mv /build/stage/usr/local/bin/hyperfine /build/stage/usr/local/sbin/hyperfine-real",
  "install -m 755 /toolchain/edgeterm-posix/runtime/wrappers/hyperfine /build/stage/usr/local/bin/hyperfine",
]
pristine_source = true

[runtime]
commands = ["hyperfine"]
mode = "streaming"
capability = "full"
adapter = "hyperfine-direct"

[tests]
smoke = ["hyperfine --version"]
