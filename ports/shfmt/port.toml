[package]
name = "shfmt"
version = "3.13.1"
revision = "1edgeterm1"
license = "BSD-3-Clause"
homepage = "https://github.com/mvdan/sh"
description = "Shell parser and formatter"
depends = []

[source]
url = "https://github.com/mvdan/sh/archive/refs/tags/v3.13.1.tar.gz"
sha256 = "b31aad2d4c26b0c6e8ebe894d59022520bbebce33e082d7d29e4325eee35d308"

[build]
system = "go"
make_args = ["-o","/build/stage/usr/local/bin/shfmt","./cmd/shfmt"]
dependencies = []
pre = []
post = []
pristine_source = true

[runtime]
commands = ["shfmt"]
mode = "streaming"
capability = "full"

[tests]
smoke = ["shfmt --version"]
