[package]
name = "p7zip"
version = "17.06"
revision = "1edgeterm2"
license = "LGPL-2.1-or-later"
homepage = "https://github.com/p7zip-project/p7zip"
description = "7-Zip archive utilities"
depends = []

[source]
url = "https://github.com/p7zip-project/p7zip/archive/refs/tags/v17.06.tar.gz"
sha256 = "c35640020e8f044b425d9c18e1808ff9206dc7caf77c9720f57eb0849d714cd1"

[build]
system = "custom"
commands = [
  "cmake -S \"$SOURCE_DIR/CPP/7zip/CMAKE/7za\" -B /build/work/p7zip -G Ninja -DCMAKE_TOOLCHAIN_FILE=/toolchain/wasix-toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=\"$CFLAGS\" -DCMAKE_CXX_FLAGS=\"$CXXFLAGS\" -DCMAKE_EXE_LINKER_FLAGS=\"$LDFLAGS\"",
  "cmake --build /build/work/p7zip --parallel \"${BUILD_JOBS:-4}\"",
  "mkdir -p /build/stage/usr/local/bin",
  "cp /build/work/p7zip/7za /build/stage/usr/local/bin/7za",
  "ln -s 7za /build/stage/usr/local/bin/7z",
  "ln -s 7za /build/stage/usr/local/bin/7zr",
]
dependencies = []
pre = []
post = []
link_compat = true
threads = true
pristine_source = true

[runtime]
commands = ["7z","7za","7zr"]
mode = "interactive"
capability = "full"

[tests]
smoke = ["7z i"]
