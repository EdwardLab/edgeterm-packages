[package]
name = "rsync"
version = "3.4.4"
revision = "1edgeterm1"
license = "GPL-3.0-or-later"
homepage = "https://rsync.samba.org/"
description = "Fast incremental file transfer utility"
depends = []

[source]
url = "https://rsync.samba.org/ftp/rsync/rsync-3.4.4.tar.gz"
sha256 = "bd88cf82fa653da32314fb229136407c5c90f80d1758d8f4b091767877d8fa96"

[build]
system = "autotools"
asyncify = true
threads = true
configure_args = ["--disable-md2man","--disable-xxhash","--disable-zstd","--disable-lz4","--disable-openssl"]
dependencies = ["zlib"]
pre = ["export CPPFLAGS=\"$CPPFLAGS -I$SOURCE_DIR/popt\"", "export CFLAGS=\"$CFLAGS -I$SOURCE_DIR/popt\""]
post = []
include_compat = true
link_compat = true

[runtime]
commands = ["rsync"]
mode = "network-preview"
capability = "socket-preview"

[tests]
smoke = ["rsync --version"]
