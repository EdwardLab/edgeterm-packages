[package]
name = "htmlq"
version = "0.4.0"
revision = "1edgeterm1"
license = "MIT"
homepage = "https://github.com/mgdm/htmlq"
description = "HTML query utility"
depends = []

[source]
url = "https://github.com/mgdm/htmlq/archive/refs/tags/v0.4.0.tar.gz"
sha256 = "c2954c0fcb3ada664b14834646aa0a2c4268683cc51fd60d47a71a9f7e77d4b9"

[build]
system = "cargo"
pristine_source = true
locked = false
install_args = ["install -m 755 target/wasm32-wasip1/release/htmlq.wasm /build/stage/usr/local/bin/htmlq"]
dependencies = []
pre = []
post = []

[runtime]
commands = ["htmlq"]
mode = "streaming"
capability = "full"

[tests]
smoke = ["htmlq --version"]
