[package]
name = "dnsutils"
version = "9.20.26"
revision = "1edgeterm1"
license = "MPL-2.0"
homepage = "https://www.isc.org/bind/"
description = "DNS query utilities"
depends = []

[source]
url = "https://downloads.isc.org/isc/bind9/9.20.26/bind-9.20.26.tar.xz"
sha256 = "55248def0f870c4c46b3de72978ea972615131516663188a4564dca1d20bf350"

[build]
system = "autotools"
configure_args = ["--disable-shared","--enable-static","--without-python","--without-libxml2","--without-json-c","--disable-doh","--with-openssl=/build/prefix"]
dependencies = ["liburcu", "libuv", "openssl", "zlib"]
pre = ["python3 /port/patch_dnsutils.py \"$SOURCE_DIR\"", "find /build/prefix -name '*.la' -delete", "sed -i '/Static linking is not supported as it disables dlopen()/s/.*as_fn_error.*/  :/' \"$SOURCE_DIR/configure\""]
post = []
build_commands = ["/usr/bin/perl \"$SOURCE_DIR/util/bindkeys.pl\" \"$SOURCE_DIR/bind.keys\" > /build/work/bind.keys.h", "make -j\"${BUILD_JOBS:-4}\" -C lib/isc CFLAGS=\"$EDGETERM_COMPILE_CFLAGS\"", "make -j\"${BUILD_JOBS:-4}\" -C lib/dns CFLAGS=\"$EDGETERM_COMPILE_CFLAGS\"", "make -j\"${BUILD_JOBS:-4}\" -C lib/isccc CFLAGS=\"$EDGETERM_COMPILE_CFLAGS\"", "make -j\"${BUILD_JOBS:-4}\" -C lib/ns CFLAGS=\"$EDGETERM_COMPILE_CFLAGS\"", "make -j\"${BUILD_JOBS:-4}\" -C lib/isccfg CFLAGS=\"$EDGETERM_COMPILE_CFLAGS\"", "make -j\"${BUILD_JOBS:-4}\" -C bin/dig CFLAGS=\"$EDGETERM_COMPILE_CFLAGS\"", "make -j\"${BUILD_JOBS:-4}\" -C bin/delv CFLAGS=\"$EDGETERM_COMPILE_CFLAGS\"", "make -j\"${BUILD_JOBS:-4}\" -C bin/nsupdate CFLAGS=\"$EDGETERM_COMPILE_CFLAGS\""]
install_commands = ["install -Dm755 bin/dig/dig /build/stage/usr/local/bin/dig", "install -Dm755 bin/dig/host /build/stage/usr/local/bin/host", "install -Dm755 bin/dig/nslookup /build/stage/usr/local/bin/nslookup", "install -Dm755 bin/delv/delv /build/stage/usr/local/bin/delv", "install -Dm755 bin/nsupdate/nsupdate /build/stage/usr/local/bin/nsupdate"]
include_compat = true
link_compat = true
link_compat_via_ldflags = true
threads = true
emulated_mman = true

[runtime]
commands = ["dig","host","nslookup","nsupdate","delv"]
mode = "network-preview"
capability = "socket-preview"

[tests]
smoke = ["dig -v"]
