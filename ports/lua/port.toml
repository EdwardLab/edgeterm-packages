[package]
name = "lua"
version = "5.5.0"
revision = "1edgeterm2"
license = "MIT"
homepage = "https://www.lua.org/"
description = "Lua programming language"
depends = []
license_file = "README"

[source]
url = "https://www.lua.org/ftp/lua-5.5.0.tar.gz"
sha256 = "57ccc32bbbd005cab75bcc52444052535af691789dba2b9016d5c50640d68b3d"

[build]
system = "custom"
asyncify = true
threads = false
commands = ["make -C \"$SOURCE_DIR\" -j\"${BUILD_JOBS:-4}\" CC=\"$CXX\" CXX=\"$CXX\" AR=\"$AR rcu\" RANLIB=\"$RANLIB\" CFLAGS=\"$CFLAGS -x c++ -fexceptions\" LDFLAGS=\"$LDFLAGS /build/libedgetermcompat.a -lc++ -lc++abi\" generic", "make -C \"$SOURCE_DIR\" AR=\"$AR rcu\" INSTALL_TOP=/build/stage/usr/local install"]
dependencies = []
pre = ["perl -0pi -e 's/#define LUA_TMPNAMBUFSIZE\\s+L_tmpnam\\n#define lua_tmpnam\\(b,e\\)\\s+\\{ e = \\(tmpnam\\(b\\) == NULL\\); \\}/#if defined(__wasi__)\\n#define LUA_TMPNAMBUFSIZE 32\\n#define lua_tmpnam(b,e) { strcpy(b, \"\\/tmp\\/lua_disabled\"); e = 1; }\\n#else\\n#define LUA_TMPNAMBUFSIZE L_tmpnam\\n#define lua_tmpnam(b,e) { e = (tmpnam(b) == NULL); }\\n#endif/' \"$SOURCE_DIR/src/loslib.c\"", "perl -0pi -e 's/#define l_lockfile\\(f\\)\\s+flockfile\\(f\\)\\n#define l_unlockfile\\(f\\)\\s+funlockfile\\(f\\)/#if defined(__wasi__)\\n#define l_lockfile(f) ((void)(f))\\n#define l_unlockfile(f) ((void)(f))\\n#else\\n#define l_lockfile(f) flockfile(f)\\n#define l_unlockfile(f) funlockfile(f)\\n#endif/' \"$SOURCE_DIR/src/liolib.c\""]
post = []

[runtime]
commands = ["lua","luac"]
mode = "interactive"
capability = "full"

[tests]
smoke = ["lua -v","lua -e 'print(1+1)'"]
