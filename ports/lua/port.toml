[package]
name = "lua"
version = "5.5.0"
revision = "1edgeterm3"
license = "MIT"
homepage = "https://www.lua.org/"
description = "Lua programming language"
depends = []
license_file = "README"

[source]
url = "https://www.lua.org/ftp/lua-5.5.0.tar.gz"
sha256 = "57ccc32bbbd005cab75bcc52444052535af691789dba2b9016d5c50640d68b3d"

[build]
system = "custom"
asyncify = true
threads = false
commands = ["make -C \"$SOURCE_DIR\" -j\"${BUILD_JOBS:-4}\" CC=\"$CXX\" CXX=\"$CXX\" AR=\"$AR rcu\" RANLIB=\"$RANLIB\" CFLAGS=\"$CFLAGS -x c++ -fexceptions\" LDFLAGS=\"$LDFLAGS\" MYLIBS=\"-lc++ -lc++abi\" generic", "make -C \"$SOURCE_DIR\" AR=\"$AR rcu\" INSTALL_TOP=/build/stage/usr/local install"]
dependencies = []
pre = []
post = []
pristine_source = true

[runtime]
commands = ["lua","luac"]
mode = "interactive"
capability = "full"

[tests]
smoke = ["lua -v","lua -e 'print(1+1)'"]
