[package]
name = "sqlite3"
version = "3.53.4"
revision = "1edgeterm1"
license = "blessing"
homepage = "https://www.sqlite.org/"
description = "SQLite command-line database"
depends = []

[source]
url = "https://www.sqlite.org/2026/sqlite-autoconf-3530400.tar.gz"
sha256 = "0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c"

[build]
system = "autotools"
configure_args = ["--disable-shared","--enable-static","--disable-readline"]
dependencies = []
pre = []
post = []

[runtime]
commands = ["sqlite3"]
mode = "interactive"
capability = "full"

[tests]
smoke = ["sqlite3 --version","sqlite3 :memory: 'select 1'"]

