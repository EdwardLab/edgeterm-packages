[package]
name = "lz4"
version = "1.10.0"
revision = "1edgeterm2"
license = "BSD-2-Clause"
homepage = "https://lz4.org/"
description = "LZ4 compression utility"
depends = []

[source]
url = "https://github.com/lz4/lz4/archive/refs/tags/v1.10.0.tar.gz"
sha256 = "537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b"

[build]
system = "custom"
pristine_source = true
commands = ["make -C \"$SOURCE_DIR/programs\" -j\"${BUILD_JOBS:-4}\" CC=\"$CC\" AR=\"$AR\" RANLIB=\"$RANLIB\" STRIP=\"$STRIP\" CFLAGS=\"$CFLAGS\" LDFLAGS=\"$LDFLAGS\" lz4-nomt", "mkdir -p /build/stage/usr/local/bin", "install -m 0755 \"$SOURCE_DIR/programs/lz4-nomt\" /build/stage/usr/local/bin/lz4", "cp /build/stage/usr/local/bin/lz4 /build/stage/usr/local/bin/unlz4", "cp /build/stage/usr/local/bin/lz4 /build/stage/usr/local/bin/lz4cat"]
make_args = []
install_args = []
install_commands = []
dependencies = []
pre = ["export LDFLAGS=\"$LDFLAGS -Wl,-z,stack-size=1048576 -Wl,--initial-memory=4194304\""]
post = []

[runtime]
commands = ["lz4","unlz4","lz4cat"]
mode = "streaming"
capability = "full"

[tests]
smoke = ["lz4 --version","printf test | lz4 | lz4 -d"]
