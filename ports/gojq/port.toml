[package]
name = "gojq"
version = "0.12.19"
revision = "1edgeterm1"
license = "MIT"
homepage = "https://github.com/itchyny/gojq"
description = "Pure Go jq implementation"
depends = []

[source]
url = "https://github.com/itchyny/gojq/archive/refs/tags/v0.12.19.tar.gz"
sha256 = "d6c6ecf8b7d9ed892216aee61101e8bc45359dc63d5ba3ab596922c4ea11e1ab"

[build]
system = "go"
make_args = ["-o", "/build/stage/usr/local/bin/gojq", "./cmd/gojq"]
dependencies = []
pre = []
post = []
pristine_source = true

[runtime]
commands = ["gojq"]
mode = "streaming"
capability = "full"

[tests]
smoke = ["gojq --version"]
