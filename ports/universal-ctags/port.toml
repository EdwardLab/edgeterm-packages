[package]
name = "universal-ctags"
version = "6.2.0"
revision = "1edgeterm2"
license = "GPL-2.0-or-later"
homepage = "https://ctags.io/"
description = "Source code indexing tool"
depends = []

[source]
url = "https://github.com/universal-ctags/ctags/archive/refs/tags/v6.2.0.tar.gz"
sha256 = "313c864bb19c7da79aea77b94db1bb44d14c1f88b992285d7ea8968b3cbc125f"

[build]
system = "autotools"
pristine_source = true
configure_args = ["--disable-shared", "--disable-json", "--disable-xml", "--disable-yaml", "--disable-seccomp", "--disable-external-sort"]
make_args = []
install_args = []
build_commands = ['make -j"${BUILD_JOBS:-4}" ctags readtags CFLAGS="$EDGETERM_COMPILE_CFLAGS"']
install_commands = ["install -d /build/stage/usr/local/bin", "install -m 755 /build/work/ctags /build/work/readtags /build/stage/usr/local/bin/"]
dependencies = []
pre = []
post = []

[runtime]
commands = ["ctags", "readtags"]
mode = "streaming"
capability = "full"

[tests]
smoke = ["ctags --version"]
