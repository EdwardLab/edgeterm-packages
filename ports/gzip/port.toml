[package]
name = "gzip"
version = "1.14"
revision = "1edgeterm2"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/gzip/"
description = "GNU gzip compression utility"
depends = []

[source]
url = "https://ftp.gnu.org/gnu/gzip/gzip-1.14.tar.gz"
sha256 = "613d6ea44f1248d7370c7ccdeee0dd0017a09e6c39de894b3c6f03f981191c6b"

[build]
system = "autotools"
pristine_source = true
configure_args = ["--disable-nls"]
dependencies = []
pre = []
post = ["cp /build/stage/usr/local/bin/gzip /build/stage/usr/local/bin/gunzip", "cp /build/stage/usr/local/bin/gzip /build/stage/usr/local/bin/zcat"]

[runtime]
commands = ["gzip","gunzip","zcat"]
mode = "streaming"
capability = "full"

[tests]
smoke = ["gzip --version","printf test | gzip | gunzip"]
