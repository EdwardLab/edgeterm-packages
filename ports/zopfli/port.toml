[package]
name = "zopfli"
version = "1.0.3"
revision = "1edgeterm1"
license = "Apache-2.0"
homepage = "https://github.com/google/zopfli"
description = "High-density DEFLATE and PNG compressor"
depends = []

[source]
url = "https://github.com/google/zopfli/archive/refs/tags/zopfli-1.0.3.tar.gz"
sha256 = "e955a7739f71af37ef3349c4fa141c648e8775bceb2195be07e86f8e638814bd"

[build]
system = "cmake"
pristine_source = true
configure_args = ["-DZOPFLI_BUILD_SHARED=OFF"]
make_args = []
install_args = []
dependencies = []
pre = []
post = []
link_compat = true

[runtime]
commands = ["zopfli", "zopflipng"]
mode = "streaming"
capability = "full"

[tests]
smoke = ["zopfli --version"]
