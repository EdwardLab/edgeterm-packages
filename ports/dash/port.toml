[package]
name = "dash"
version = "0.5.13.5"
revision = "1edgeterm1"
license = "BSD-3-Clause"
homepage = "http://gondor.apana.org.au/~herbert/dash/"
description = "POSIX command shell"
depends = []

[source]
url = "https://cdn.netbsd.org/pub/pkgsrc/distfiles/dash-0.5.13.5.tar.gz"
sha256 = "40090101a2a491f13e901d3d48e90414f26634628b9bfff35ff540363c227a7d"

[build]
system = "autotools"
asyncify = true
threads = true
configure_args = []
dependencies = []
pre = ["export ac_cv_func_memfd_create=yes"]
post_configure = ["sed -i 's|^LDFLAGS = -static$|LDFLAGS = -static -pthread -Wl,--initial-memory=16777216 -Wl,--max-memory=268435456 -Wl,--export=__stack_pointer -Wl,--export=__heap_base -Wl,--export=__data_end|' /build/work/Makefile /build/work/src/Makefile"]
post = []
emulated_mman = true
link_compat = true

[runtime]
commands = ["dash"]
mode = "interactive"
capability = "full"

[tests]
smoke = ["dash -c 'printf ok'"]
